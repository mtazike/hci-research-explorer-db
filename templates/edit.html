<!DOCTYPE html>
<html>
<head>
    <title>Edit Paper - HCI Research Explorer</title>
</head>
<body>
    <h1>Edit Paper</h1>
    <p><a href="/">Back to search</a></p>

    <form method="POST" action="/edit-paper">
        <input type="hidden" name="paper_id" value="{{ paper[0] }}">

        <label for="title">Title:</label>
        <input type="text" name="title" id="title" size="50" value="{{ paper[1] }}" required>
        <br><br>

        <button type="submit">Save Changes</button>
    </form>
</body>
</html>
